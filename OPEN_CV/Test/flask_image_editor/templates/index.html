<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🖼️ Flask Image Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
        }
        .container {
            max-width: 700px;
            margin-top: 60px;
        }
        .card {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }
        .btn-custom {
            width: 100%;
            margin-top: 10px;
        }
        .form-label {
            font-weight: bold;
        }
        .section-title {
            margin-top: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #343a40;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-4">
        <h2 class="text-center mb-4">🖼️ Image Editor - Flask + OpenCV</h2>
        <form action="/" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="image" class="form-label">Upload Image</label>
                <input class="form-control" type="file" name="image" id="image" required>
            </div>

            <div class="section-title">🔧 Resize Image</div>
            <div class="row">
                <div class="col">
                    <label for="width" class="form-label">Width</label>
                    <input type="number" name="width" id="width" class="form-control" value="300">
                </div>
                <div class="col">
                    <label for="height" class="form-label">Height</label>
                    <input type="number" name="height" id="height" class="form-control" value="300">
                </div>
            </div>

            <div class="section-title">✂️ Crop Image</div>
            <div class="row">
                <div class="col">
                    <label class="form-label">X</label>
                    <input type="number" name="x" class="form-control" value="0">
                </div>
                <div class="col">
                    <label class="form-label">Y</label>
                    <input type="number" name="y" class="form-control" value="0">
                </div>
                <div class="col">
                    <label class="form-label">Width</label>
                    <input type="number" name="w" class="form-control" value="100">
                </div>
                <div class="col">
                    <label class="form-label">Height</label>
                    <input type="number" name="h" class="form-control" value="100">
                </div>
            </div>

            <div class="section-title">🎨 Actions</div>
            <button type="submit" name="action" value="grayscale" class="btn btn-dark btn-custom">Convert to Grayscale</button>
            <button type="submit" name="action" value="resize" class="btn btn-primary btn-custom">Resize</button>
            <button type="submit" name="action" value="crop" class="btn btn-warning btn-custom">Crop</button>
        </form>
    </div>
</div>
</body>
</html>
